[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name          tail
    Path          /lab/logs/suricata/eve.json
    Parser        json
    Tag           mayajal.suricata
    DB            /lab/state/fluent-bit-suricata.db
    Mem_Buf_Limit 20MB
    Skip_Long_Lines On
    Refresh_Interval 2

[FILTER]
    Name          record_modifier
    Match         mayajal.*
    Record        session_id ${SESSIONID}
    Record        lab_id ${LAB_UUID}
    Record        user_id ${USERID}
    Record        project_id ${LABID}
    Record        collector fluent-bit
    Record        telemetry_source suricata

[OUTPUT]
    Name          forward
    Match         mayajal.*
    Host          ${TELEMETRY_HOST}
    Port          ${TELEMETRY_PORT}
    Retry_Limit   False
