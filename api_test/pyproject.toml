[project]
name = "mayajal-core-api"
version = "0.1.0"
description = "Role-aware backend for Mayajal security labs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.1",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.48",
  "PyJWT[crypto]>=2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
