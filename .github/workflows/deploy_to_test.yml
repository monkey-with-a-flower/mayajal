name: Deploy to test
run-name: ${{ github.actor }} is deploying to test.
on: 
  push:
    branches:
      - dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/mayajal
            git pull
            cd ./api
            uv run fastapi dev main.py --host 0.0.0.0
